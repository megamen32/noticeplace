# Install as /etc/fail2ban/action.d/notify-center.conf.  It contains no token.
[Definition]
actionstart =
actionstop =
actioncheck =

# Fail2ban must never depend on delivery success to apply a ban.  The producer
# timeout is bounded; the durable center owns retry after a successful accept.
actionban = /bin/sh -c 'set -a; . /etc/fail2ban/notify-center.env; set +a; H=$(hostname -f 2>/dev/null || hostname); K=$(cat /proc/sys/kernel/random/uuid); /usr/local/bin/notify-producer --project "$NOTIFY_PROJECT" --recipient "$NOTIFY_RECIPIENT" --severity notice --dedupe-key "fail2ban:$NOTIFY_PROJECT:<name>:<ip>" --idempotency-key "fail2ban-ban:$NOTIFY_PROJECT:<name>:<ip>:$K" --title "Fail2ban ban: <name> <ip>" --body "$H banned <ip> for <bantime>s via <name>" || true'

actionunban = /bin/sh -c 'set -a; . /etc/fail2ban/notify-center.env; set +a; K=$(cat /proc/sys/kernel/random/uuid); /usr/local/bin/notify-producer --resolve --project "$NOTIFY_PROJECT" --recipient "$NOTIFY_RECIPIENT" --dedupe-key "fail2ban:$NOTIFY_PROJECT:<name>:<ip>" --idempotency-key "fail2ban-unban:$NOTIFY_PROJECT:<name>:<ip>:$K" || true'
