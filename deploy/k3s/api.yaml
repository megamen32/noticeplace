apiVersion: v1
kind: Namespace
metadata:
  name: noticeplace-pilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: noticeplace-pilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: noticeplace-api}
  template:
    metadata:
      labels: {app: noticeplace-api}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        noticeplace-mesh-host: server44
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 996
        runAsGroup: 995
      containers:
        - name: api
          image: NOTICEPLACE_API_IMAGE
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: producer-api}
          env:
            - {name: NOTIFY_CENTER_HOST, value: "0.0.0.0"}
            - {name: NOTIFY_CENTER_PORT, value: "8091"}
          ports:
            - {name: http, containerPort: 8091}
          resources:
            requests: {cpu: "100m", memory: "64Mi"}
            limits: {cpu: "1", memory: "256Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            exec: {command: [python, /app/healthcheck.py]}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: sql, mountPath: /run/noticeplace-mesh, readOnly: true}
            - {name: core, mountPath: /run/noticeplace-mesh-core, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: sql
          hostPath: {path: /run/noticeplace-mesh, type: Directory}
        - name: core
          hostPath: {path: /run/noticeplace-mesh-core, type: Directory}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: "16Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: noticeplace-pilot
spec:
  type: NodePort
  selector: {app: noticeplace-api}
  ports:
    - {name: http, port: 8091, targetPort: http, nodePort: 30095}
