[Service]
# Keep the OpenCode server credential outside git and outside the unit command.
EnvironmentFile=-%h/.config/agent-herder/opencode.env
# The Codex Stop hook and Agent Herder HTTP choice callback must share this
# durable registry; do not let the service fall back to a second state tree.
Environment=AGENT_HERDER_AUTOPILOT_STATE_DIR=%h/.local/state/agent-herder/autopilot-live
