# Include inside the notify.bezrabotnyi.com HTTPS server block.
location = /admin {
    return 301 /admin/;
}

location = /_notify_admin_auth/check {
    internal;
    proxy_pass http://127.0.0.1:18991/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $scheme://$http_host$request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location @notify_admin_login {
    return 302 https://auth.bezrabotnyi.com/login?rd=$scheme://$http_host$request_uri;
}

location ^~ /admin/ {
    auth_request /_notify_admin_auth/check;
    error_page 401 = @notify_admin_login;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Notify-Admin "1";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
