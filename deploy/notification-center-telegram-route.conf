[Service]
# Owner order 2026-11-06 23:10: the Telegram surface is three supergroups.
# «Решения» carries every card with buttons (questions, plan choices),
# «Уведомления» only emergency+critical incidents and their closures,
# «Логи» the routine rest and ships DISABLED by default.
Environment=TELEGRAM_CHAT_ID=-1004322359393
# AskHuman questions and task decisions always land in «Решения».
Environment=TELEGRAM_DECISIONS_CHAT_ID=-1004419894781
EnvironmentFile=/etc/notification-center-telegram-routes.env
# «Логи» is intentionally absent here: enabling it later is one explicit
# operator edit, never a default.
# Route JSON lives in the operator-owned EnvironmentFile above. Keeping one
# source avoids systemd Environment= quote parsing changing the JSON value.
# The three chats are separate supergroups, so no forum topic reconciliation
# runs; the legacy log topic id stays pinned in the route for when «Логи»
# is explicitly re-enabled.
